<div class="stats">${S.about.stats.map((s,i)=>`<div class="stat">${E(`about.stats.${i}.v`,"b")}${E(`about.stats.${i}.l`)}</div>`).join("")}</div><div class="bg">${E("about.bgT","h2")}${E("about.bg","p")}</div></div></section>
<section id="products"><div class="w rv"><h2>Products</h2><div class="grid">${S.products.map((p,i)=>`<article class="card">${ctl("products",i)}${IB("products",i,p.src,p.t)}<div class="b">${E(`products.${i}.t`,"h3")}${E(`products.${i}.s`,"p","spec")}${E(`products.${i}.d`,"p")}<a class="btn" href="#contact" data-enq="${esc(p.t)}">Enquire</a></div></article>`).join("")}</div>${add("products","+ Add product")}${E("also","p","also")}</div></section>
<section id="gallery"><div class="w rv"><h2>Gallery</h2><div class="fl">${cats.map(c=>`<button data-f="${esc(c)}" class="${c===filt?"on":""}">${esc(c)}</button>`).join("")}</div>
<div class="grid">${S.gallery.map((g,i)=>g.c===filt||filt==="All"?`<figure class="gi">${ctl("gallery",i)}${IB("gallery",i,g.src,g.t,`data-lb="${i}"`)}<figcaption>${E(`gallery.${i}.t`)}</figcaption></figure>`:"").join("")}</div>${add("gallery","+ Upload gallery images")}</div></section>
<section id="customers"><div class="w rv"><h2>Customers</h2><div class="grid">${S.customers.map((c,i)=>`<div class="card cust">${ctl("customers",i)}${c.src?IB("customers",i,c.src,c.n):E(`customers.${i}.n`)}</div>`).join("")}</div>${add("customers","+ Add customer")}</div></section>
<section id="quality"><div class="w rv"><h2>Quality</h2>${E("quality.intro","p")}${E("quality.recT","h3")}<ul class="obj">${S.quality.rec.map((o,i)=>`<li>${E(`quality.rec.${i}`)}</li>`).join("")}</ul><div class="bg">${E("quality.polT","h2")}${(x=>ed?x:x.replace(/“[^”]*”/,"<strong>$&</strong>"))(E("quality.pol","p"))}${E("quality.pol2","p")}<ul class="obj">${S.quality.obj.map((o,i)=>`<li>${E(`quality.obj.${i}`)}</li>`).join("")}</ul></div></div></section>
<section id="contact"><div class="w rv"><h2>Contact</h2><div class="cgrid"><div class="info"><p>${E("contact.addr")}</p><p>${tel("contact.ph1")}<br>${tel("contact.ph2")}</p><p>${ed?E("contact.email"):`<a href="${GM(S.contact.email)}" target="_blank" rel="noopener">${esc(S.contact.email)}</a>`}</p>
<div class="acts"><button type="button" class="btn" data-call>Call</button><a class="btn o" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=${encodeURIComponent(S.contact.email)}" target="_blank" rel="noopener">Email</a><a class="btn o" href="${wa}" target="_blank" rel="noopener">WhatsApp</a><button type="button" class="btn o" data-copy="email">Copy email</button></div>
<div class="mapc"><b>Find us on the map</b><p>${esc(S.contact.addr)}</p><div class="acts"><a class="btn" href="https://www.google.com/maps/dir/?api=1&amp;travelmode=driving&amp;destination=${encodeURIComponent(CONFIG.mapDestination||"Hi-Volt Engineering Solutions, "+S.contact.addr)}" target="_blank" rel="noopener">Open in Google Maps</a><button type="button" class="btn o" data-copy="addr">Copy address</button></div></div>
</div>
<form id="ef" ${CONFIG.formAction?`action="${esc(CONFIG.formAction)}" method="post"`:""}><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Subject<input name="subject" id="sub"></label><label>Message<textarea name="message" rows="5" required></textarea></label><button class="btn" type="submit">Send enquiry by email</button><button class="btn o" type="button" data-wa>Send on WhatsApp</button></form></div></div></section>`;
 $$(".rv").forEach(el=>io.observe(el));show();
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});

/* ---- images: validate, resize to 1600px, compress ---- */
function proc(file){return new Promise((ok,no)=>{
 if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))return no("Use JPG, PNG, WebP or GIF.");
 if(file.size>12e6)return no("Image is over 12 MB.");
 const r=new FileReader();r.onerror=()=>no("Could not read file.");
 r.onload=()=>{const im=new Image();im.onerror=()=>no("Not a valid image.");
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
   let u=c.toDataURL("image/webp",.82);if(!u.startsWith("data:image/webp"))u=c.toDataURL("image/jpeg",.85);ok(u)};im.src=r.result};
 r.readAsDataURL(file)})}
$("#fi").addEventListener("change",async e=>{
 const fs=[...e.target.files];e.target.value="";if(!fs.length||!tgt)return;
 for(const f of fs){try{const u=await proc(f);
  if(tgt.l==="logo")S.logo=u;else if(tgt.i<0)S.gallery.push({src:u,t:f.name.replace(/\.[^.]+$/,""),c:filt==="All"?"General":filt});else S[tgt.l][tgt.i].src=u}catch(m){toast(m)}}
 save();render()});

/* ---- delegated clicks ---- */
document.addEventListener("click",async e=>{
 const q=e.target.closest("[data-act]");
 if(q){const{act,l,i}=q.dataset,n=+i,a=S[l];
  if(act==="up"||act==="down"){const j=n+(act==="up"?-1:1);if(j<0||j>=a.length)return;[a[n],a[j]]=[a[j],a[n]]}
  else if(act==="del"){if(!(await ask("Delete this item? This cannot be undone.")))return;a.splice(n,1)}
  else if(act==="img"){tgt={l,i:n};$("#fi").multiple=false;$("#fi").click();return}
  else if(act==="fit"){const o=["cover","contain","fill"],c=a[n].fit||(l==="customers"?"contain":"cover");a[n].fit=o[(o.indexOf(c)+1)%3];toast({cover:"Fill frame (crops the edges)",contain:"Show the whole picture",fill:"Stretch to the frame"}[a[n].fit])}
  else if(act==="match"){const fr=document.querySelector(`.ib[data-l="${l}"][data-i="${n}"]`),im=fr&&fr.querySelector("img");if(!a[n].src||!im||!im.naturalWidth){toast("Upload an image first.");return}const w=fr.offsetWidth;a[n].w=w;a[n].h=Math.max(24,Math.round(w*im.naturalHeight/im.naturalWidth));a[n].fit="contain";toast("Frame now matches the picture's shape")}
  else if(act==="cat"){const v=await ask("Category name:",a[n].c,true);if(v===null)return;a[n].c=v.trim()||"General"}
  else if(act==="add"){if(l==="gallery"){tgt={l,i:-1};$("#fi").multiple=true;$("#fi").click();return}a.push(BLANK[l]())}
  save();render();return}
 const f=e.target.closest("[data-f]");if(f){filt=f.dataset.f;render();return}
 const en=e.target.closest("[data-enq]");if(en){setTimeout(()=>{$("#sub").value="Enquiry: "+en.dataset.enq},0);return}
 const lb=e.target.closest("[data-lb]");if(lb&&!ed){lbL=S.gallery.filter(g=>filt==="All"||g.c===filt);lbI=lbL.indexOf(S.gallery[+lb.dataset.lb]);open()}
});
document.addEventListener("input",e=>{if(e.target.tagName==="TEXTAREA"){e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"}const p=e.target.dataset&&e.target.dataset.p;if(p&&ed){set(p,e.target.innerText.trim());clearTimeout(save.t);save.t=setTimeout(save,400)}});
document.addEventListener("submit",e=>{if(e.target.id!=="ef"||CONFIG.formAction)return;e.preventDefault();const d=new FormData(e.target);
 const subj=d.get("subject")||"Website enquiry",body=d.get("message")+"\n\nFrom: "+d.get("name")+" ("+d.get("email")+")";const g=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(S.contact.email)}&su=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;openLink(g);toast("Your email draft opened in a new tab. Press Send there to finish.")});

/* ---- lightbox ---- */
function open(){const g=lbL[lbI];if(!g)return;const im=$("#lb img");im.src=g.src||ph(g.t);im.alt=g.t;$("#cap").textContent=g.t;$("#lb").classList.add("on")}
const step=d=>{lbI=(lbI+d+lbL.length)%lbL.length;open()},close=()=>$("#lb").classList.remove("on");
$("#lb .p").onclick=()=>step(-1);$("#lb .n").onclick=()=>step(1);$("#lb .c").onclick=close;
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")close()});
document.addEventListener("keydown",e=>{if(!$("#lb").classList.contains("on"))return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
let sx=0;$("#lb").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});
$("#lb").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)step(d>0?-1:1)});
document.addEventListener("error",e=>{const t=e.target;if(t.tagName==="IMG"&&!t.dataset.f){t.dataset.f=1;t.src=ph(t.alt)}},true);

/* ---- in-page dialogs (browser prompt/confirm are blocked on published pages) ---- */
function ask(msg,def,inp,pw){return new Promise(res=>{const d=$("#dlg"),i=d.querySelector("input");d.querySelector("p").textContent=msg;i.style.display=inp?"block":"none";i.type=pw?"password":"text";i.value=def||"";d.classList.add("on");if(inp)i.focus();
 const done=v=>{d.classList.remove("on");d.onsubmit=null;d.querySelector("[data-n]").onclick=null;res(v)};
 d.onsubmit=e=>{e.preventDefault();done(inp?i.value:true)};d.querySelector("[data-n]").onclick=()=>done(inp?null:false)})}
/* ---- edit mode ---- */
$("#lock").onclick=async()=>{if(ed)return;const p=await ask("Owner password:","",true,true);if(p===null)return;if(p===CONFIG.password){ed=true;render();toast("Edit mode on")}else toast("Wrong password")};
$("#bar").addEventListener("click",async e=>{const b=e.target.dataset.b;if(!b)return;
 if(b==="save")save(true);
 if(b==="out"){ed=false;save();render()}
 if(b==="logo"){tgt={l:"logo",i:null};$("#fi").multiple=false;$("#fi").click()}
 if(b==="nologo"){S.logo="";save();render()}
 if(b==="rst"&&await ask("Reset everything to the default content? Your edits will be lost.")){S=clone(DEFAULT);save();render()}
 if(b==="exp"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="hivolt-portfolio.json";a.click();toast("Exported. Keep this file safe.")}
 if(b==="imp")$("#ji").click()});
$("#ji").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.gallery||!d.contact)throw 0;S=d;save();render();toast("Imported")}catch(x){toast("Invalid portfolio JSON file.")}};r.readAsText(f)});

$("#yr").textContent=new Date().getFullYear();
/* ---- enquiry via WhatsApp ---- */
document.addEventListener("click",e=>{if(!e.target.closest("[data-wa]"))return;const f=$("#ef");if(!f.reportValidity())return;const d=new FormData(f);openLink("https://wa.me/"+S.contact.ph1.replace(/\D/g,"")+"?text="+encodeURIComponent("Hello Hi-Volt Engineering Solutions,\n\nSubject: "+(d.get("subject")||"Enquiry")+"\n"+d.get("message")+"\n\nName: "+d.get("name")+"\nEmail: "+d.get("email")))});
/* ---- call dialog: tel: links are blocked inside published pages, so offer Call + Copy ---- */
document.addEventListener("click",e=>{const c=e.target.closest("[data-call]");if(c){e.preventDefault();$("#cl").innerHTML=["ph1","ph2"].map(k=>`<div class="r" style="justify-content:space-between;align-items:center"><b>${esc(S.contact[k])}</b><span style="display:flex;gap:8px"><a class="btn" href="tel:${esc(S.contact[k].replace(/[^\d+]/g,""))}" target="_blank" rel="noopener">Call</a><button type="button" class="btn o" data-copy="${k}">Copy</button></span></div>`).join("");$("#cm").classList.add("on");return}if(e.target.closest("[data-cmx]")||e.target.id==="cm")$("#cm").classList.remove("on")});
/* ---- copy buttons (email / address) ---- */
document.addEventListener("click",async e=>{const c=e.target.closest("[data-copy]");if(!c)return;const t=S.contact[c.dataset.copy];let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(x){try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();ok=document.execCommand("copy");a.remove()}catch(y){}}toast(ok?"Copied: "+t:"Copy was blocked. Please select the text and copy it.")});
/* ---- page navigation: one section visible at a time ---- */
const PAGES=["home","about","products","gallery","customers","quality","contact"];
let pg=PAGES.includes(location.hash.slice(1))?location.hash.slice(1):"home";
function show(){$$("#app > section").forEach(s=>s.classList.toggle("act",s.id===pg));$$("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+pg))}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute("href").slice(1);if(!PAGES.includes(id))return;e.preventDefault();pg=id;try{location.hash=id}catch(x){}show();scrollTo(0,0)});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);pg=PAGES.includes(h)?h:"home";show();scrollTo(0,0)});
document.addEventListener("pointerup",()=>{if(!ed)return;const b=$(".lbox");if(b&&(b.offsetWidth!==S.lw||b.offsetHeight!==S.lh)){S.lw=b.offsetWidth;S.lh=b.offsetHeight;save()}});
document.addEventListener("pointerup",()=>{if(!ed)return;$$(".ib").forEach(b=>{const a=S[b.dataset.l],it=a&&a[+b.dataset.i];if(!it||!b.style.width||!b.offsetWidth)return;const w=b.offsetWidth,h=b.offsetHeight;if(w!==it.w||h!==it.h){it.w=w;it.h=h;save()}})});
(async()=>{let r=null;try{r=await idb("get")}catch(e){}if(!r)try{r=localStorage.getItem(CONFIG.storageKey)}catch(e){}S=load(r);render()})();
</script>
